version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: daily
      time: "06:00"
      timezone: Etc/UTC
    groups:
      dev-deps:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      prod-deps-ver:
        applies-to: version-updates
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      prod-deps-sec:
        applies-to: security-updates
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
    reviewers:
      - "kuntzed"
      - "NiklasHerrmann21"
    open-pull-requests-limit: 10

  - package-ecosystem: maven
    directory: "/"
    target-branch: "main-3.x"
    schedule:
      interval: daily
      time: "06:00"
      timezone: Etc/UTC
    groups:
      dev-deps:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      prod-deps-ver:
        applies-to: version-updates
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      prod-deps-sec:
        applies-to: security-updates
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
    # main-3.x intentionally stays on Spring Boot 3 / Spring Framework 6 /
    # Spring Security 6 / JUnit 5. Block all major-version bumps for these so
    # Dependabot stops opening ungrouped major PRs (e.g. Spring Boot 4) here.
    ignore:
      - dependency-name: "org.springframework.boot:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.springframework:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.springframework.security:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.junit.jupiter:*"
        update-types: ["version-update:semver-major"]
    reviewers:
      - "kuntzed"
      - "NiklasHerrmann21"
    open-pull-requests-limit: 10
